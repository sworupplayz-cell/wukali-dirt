<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7ec4e8" />
  <title>Wukali Dirt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #7ec4e8; touch-action: none;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif; user-select: none; -webkit-user-select: none; }
    #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 20; }
    .hidden { display: none !important; }

    .panel { display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 26px 34px; border-radius: 18px; background: rgba(20, 26, 20, 0.72); }
    .title { color: #ffca28; font-size: clamp(30px, 7vmin, 52px); font-weight: 800; letter-spacing: 2px;
      text-shadow: 0 3px 0 rgba(0,0,0,0.35); margin-bottom: 6px; }
    .subtitle { color: #cfd8dc; font-size: clamp(12px, 2.4vmin, 16px); margin-top: -8px; margin-bottom: 8px; }

    .menu-btn { min-width: clamp(180px, 40vmin, 260px); padding: 13px 22px; border: none; border-radius: 12px;
      background: #e65100; color: #fff; font-size: clamp(16px, 3.4vmin, 22px); font-weight: 700;
      letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
    .menu-btn.secondary { background: rgba(255,255,255,0.14); }
    .menu-btn:active { transform: scale(0.96); filter: brightness(1.15); }

    .about-text { color: #fff; font-size: clamp(18px, 4vmin, 26px); font-weight: 600; padding: 8px 0 14px; }

    #rotate-hint { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 10px; display: none; }
    @media (orientation: portrait) { #rotate-hint { display: block; } }

    /* HUD */
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    .ctl { position: fixed; display: flex; align-items: center; justify-content: center;
      border-radius: 20px; background: rgba(0, 0, 0, 0.28); border: 2px solid rgba(255,255,255,0.35);
      color: rgba(255,255,255,0.9); font-weight: 800; touch-action: none; }
    .ctl.active { background: rgba(255, 152, 0, 0.55); border-color: rgba(255,255,255,0.8); }
    .ctl svg { pointer-events: none; }

    #btn-left  { left: max(12px, env(safe-area-inset-left)); bottom: 14px;
      width: clamp(70px, 16vmin, 110px); height: clamp(70px, 16vmin, 110px); font-size: 34px; }
    #btn-right { left: calc(max(12px, env(safe-area-inset-left)) + clamp(70px, 16vmin, 110px) + 14px); bottom: 14px;
      width: clamp(70px, 16vmin, 110px); height: clamp(70px, 16vmin, 110px); font-size: 34px; }
    #btn-gas   { right: max(12px, env(safe-area-inset-right)); bottom: 14px;
      width: clamp(80px, 18vmin, 120px); height: clamp(80px, 18vmin, 120px); font-size: 20px; border-radius: 50%; }
    #btn-brake { right: calc(max(12px, env(safe-area-inset-right)) + clamp(80px, 18vmin, 120px) + 16px); bottom: 14px;
      width: clamp(66px, 14vmin, 95px); height: clamp(66px, 14vmin, 95px); font-size: 16px; border-radius: 50%; }

    /* Phase 3I-2: LEAN (left, above steering) and TRICK (right, above brake) */
    #btn-lean { left: max(12px, env(safe-area-inset-left));
      bottom: calc(14px + clamp(70px, 16vmin, 110px) + 12px);
      width: clamp(84px, 15vmin, 118px); height: clamp(44px, 9vmin, 60px); font-size: 15px;
      border-radius: 999px; background: rgba(0, 121, 107, 0.34); border-color: rgba(128, 222, 234, 0.55); }
    #btn-lean.active { background: rgba(0, 188, 170, 0.6); border-color: rgba(255,255,255,0.85); }
    #btn-trick { right: calc(max(12px, env(safe-area-inset-right)) + clamp(80px, 18vmin, 120px) + 16px);
      bottom: calc(14px + clamp(66px, 14vmin, 95px) + 12px);
      width: clamp(84px, 15vmin, 118px); height: clamp(44px, 9vmin, 60px); font-size: 15px;
      border-radius: 999px; background: rgba(123, 31, 162, 0.36); border-color: rgba(225, 190, 231, 0.55); }
    #btn-trick.active { background: rgba(186, 104, 200, 0.65); border-color: rgba(255,255,255,0.85); }

    #btn-pause { top: 10px; right: max(12px, env(safe-area-inset-right));
      width: clamp(46px, 9vmin, 60px); height: clamp(46px, 9vmin, 60px); font-size: 20px; border-radius: 12px; }
    #btn-reset { top: 10px; right: calc(max(12px, env(safe-area-inset-right)) + clamp(46px, 9vmin, 60px) + 10px);
      width: clamp(46px, 9vmin, 60px); height: clamp(46px, 9vmin, 60px); font-size: 22px; border-radius: 12px; }
    #btn-pov { top: 10px; right: calc(max(12px, env(safe-area-inset-right)) + (clamp(46px, 9vmin, 60px) + 10px) * 2);
      width: clamp(46px, 9vmin, 60px); height: clamp(46px, 9vmin, 60px);
      font-size: clamp(11px, 2.2vmin, 14px); border-radius: 12px; font-weight: 800; }

    #speedo { position: fixed; top: 12px; left: max(14px, env(safe-area-inset-left)); color: #fff;
      font-size: clamp(18px, 4vmin, 26px); font-weight: 800; text-shadow: 0 2px 3px rgba(0,0,0,0.45);
      pointer-events: none; }
    #speedo span { font-size: 0.55em; font-weight: 600; opacity: 0.85; }
    #distance { position: fixed; top: calc(14px + clamp(18px, 4vmin, 26px) * 1.3);
      left: max(14px, env(safe-area-inset-left)); color: rgba(255,255,255,0.92);
      font-size: clamp(13px, 2.8vmin, 18px); font-weight: 700;
      text-shadow: 0 2px 3px rgba(0,0,0,0.45); pointer-events: none; }
    #score { position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      color: #ffca28; font-size: clamp(16px, 3.6vmin, 24px); font-weight: 800;
      text-shadow: 0 2px 3px rgba(0,0,0,0.45); pointer-events: none; }

    /* Stunt toast: transform/opacity only (GPU-cheap), never intercepts touch */
    #stunt-toast { position: fixed; top: 24%; left: 50%; pointer-events: none;
      transform: translate(-50%, 8px) scale(0.8); opacity: 0;
      color: #ffe082; font-size: clamp(20px, 5vmin, 34px); font-weight: 900; letter-spacing: 1px;
      text-shadow: 0 3px 0 rgba(0,0,0,0.4); transition: transform 0.18s ease-out, opacity 0.18s ease-out;
      white-space: nowrap; z-index: 15; }
    #stunt-toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
    #stunt-toast.bad { color: #ff8a65; }
    /* Live combo HUD (Phase 3I-1): small, unobtrusive, GPU-cheap */
    #combo-hud { position: fixed; top: 33%; left: 50%; pointer-events: none;
      transform: translate(-50%, 0) scale(0.9); opacity: 0;
      color: #b9f6ca; font-size: clamp(14px, 3.4vmin, 22px); font-weight: 800; letter-spacing: 1px;
      text-shadow: 0 2px 0 rgba(0,0,0,0.4); transition: transform 0.12s ease-out, opacity 0.15s ease-out;
      white-space: nowrap; z-index: 15; }
    #combo-hud.show { opacity: 1; }
    #combo-hud.pop { transform: translate(-50%, 0) scale(1.12); }
    #combo-hud.show:not(.pop) { transform: translate(-50%, 0) scale(1); }

    /* Summit banner: one reused node, transform/opacity only */
    #summit-banner { position: fixed; top: 16%; left: 50%; pointer-events: none; z-index: 16;
      transform: translate(-50%, 10px) scale(0.85); opacity: 0;
      transition: transform 0.25s ease-out, opacity 0.25s ease-out;
      text-align: center; padding: 14px 26px; border-radius: 16px;
      background: rgba(18, 26, 20, 0.78); }
    #summit-banner.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
    #summit-banner .sb-top { color: #b3e5fc; font-size: clamp(13px, 2.8vmin, 17px);
      font-weight: 700; letter-spacing: 2px; }
    #summit-banner .sb-name { color: #fff; font-size: clamp(22px, 5vmin, 34px);
      font-weight: 900; margin: 2px 0; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
    #summit-banner .sb-ach { color: #ffca28; font-size: clamp(14px, 3vmin, 19px);
      font-weight: 700; }

    .stats { display: grid; grid-template-columns: auto auto; gap: 4px 22px;
      margin: 4px 0 10px; font-size: clamp(14px, 3vmin, 19px); color: #cfd8dc; }
    .stats b { color: #fff; text-align: right; }
    .stats .best-new { color: #ffca28; }

    /* Pause / game-over overlays block everything underneath */
    #pause-overlay, #gameover-overlay { background: rgba(10, 14, 10, 0.55); }
    .crash-msg { color: #ff7043; font-size: clamp(26px, 6vmin, 42px); font-weight: 800;
      text-shadow: 0 3px 0 rgba(0,0,0,0.4); margin-bottom: 4px; }

    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #fff; padding: 10px 18px; border-radius: 10px;
      font-size: 14px; z-index: 40; transition: opacity 0.4s; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- Main menu -->
  <div id="menu-overlay" class="overlay">
    <div class="panel">
      <div class="title">WUKALI DIRT</div>
      <div class="subtitle">Off-road dirt bike &mdash; Phase 1 prototype</div>
      <button class="menu-btn" id="btn-play">PLAY</button>
      <button class="menu-btn secondary" id="btn-music">MUSIC: ON</button>
      <button class="menu-btn secondary" id="btn-about">ABOUT</button>
      <button class="menu-btn secondary" id="btn-exit">EXIT</button>
      <div id="rotate-hint">Tip: rotate to landscape for the best experience</div>
    </div>
  </div>

  <!-- About -->
  <div id="about-overlay" class="overlay hidden">
    <div class="panel">
      <div class="about-text">Made by Sworup Karki</div>
      <button class="menu-btn secondary" id="btn-about-back">BACK</button>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause-overlay" class="overlay hidden">
    <div class="panel">
      <div class="title" style="font-size:clamp(22px,5vmin,34px);">PAUSED</div>
      <button class="menu-btn" id="btn-resume">RESUME</button>
      <button class="menu-btn secondary" id="btn-restart">RESTART</button>
      <button class="menu-btn secondary" id="btn-main-menu">MAIN MENU</button>
    </div>
  </div>

  <!-- Game over (genuine crash ends the run) -->
  <div id="gameover-overlay" class="overlay hidden">
    <div class="panel">
      <div class="crash-msg">CRASHED!</div>
      <div class="stats">
        <span>Distance</span><b id="go-distance">0 m</b>
        <span>Best</span><b id="go-best">0 m</b>
        <span>Stunt Score</span><b id="go-score">0</b>
      </div>
      <button class="menu-btn" id="btn-go-restart">RESTART</button>
      <button class="menu-btn secondary" id="btn-go-menu">MAIN MENU</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="speedo">0 <span>km/h</span></div>
    <div id="distance">0 m</div>
    <div id="score"></div>
    <div id="stunt-toast"></div>
    <div id="combo-hud"></div>
    <div id="summit-banner">
      <div class="sb-top">&#127956;&#65039; SUMMIT REACHED</div>
      <div class="sb-name" id="sb-name"></div>
      <div class="sb-ach" id="sb-ach"></div>
    </div>
    <div class="ctl" id="btn-left"   data-control="left">&#9664;</div>
    <div class="ctl" id="btn-right"  data-control="right">&#9654;</div>
    <div class="ctl" id="btn-brake"  data-control="brake">BRAKE</div>
    <div class="ctl" id="btn-gas"    data-control="gas">GAS</div>
    <div class="ctl" id="btn-lean"   data-control="lean">LEAN</div>
    <div class="ctl" id="btn-trick"  data-control="trick">TRICK</div>
    <div class="ctl" id="btn-pause">&#10074;&#10074;</div>
    <div class="ctl" id="btn-reset">&#8634;</div>
    <div class="ctl" id="btn-pov">POV</div>
  </div>

  <div id="toast"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
